name: Resolve PR Readiness

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  resolve:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/eva-readiness ')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: Validate maintainer readiness decision
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          decision_json="$(python3 - <<'PY'
          import json
          import os
          import re

          match = re.fullmatch(
            r"/eva-readiness (approve|request-changes) ([0-9a-f]{40})\Z",
            os.environ.get("COMMENT_BODY", ""),
          )
          if not match:
            print('{"valid":false}')
          else:
            decision, head_sha = match.groups()
            state = "success" if decision == "approve" else "failure"
            description = "Maintainer approved readiness" if decision == "approve" else "Maintainer requested changes"
            print(json.dumps({
              "valid": True,
              "decision": decision,
              "head_sha": head_sha,
              "state": state,
              "description": description,
            }, separators=(",", ":")))
          PY
          )"
          if [[ "$(jq -r '.valid' <<< "$decision_json")" != "true" ]]; then
            echo "::notice::Ignoring malformed readiness decision command."
            exit 0
          fi
          decision="$(jq -r '.decision' <<< "$decision_json")"
          expected_head_sha="$(jq -r '.head_sha' <<< "$decision_json")"
          state="$(jq -r '.state' <<< "$decision_json")"
          description="$(jq -r '.description' <<< "$decision_json")"
          permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq '.permission')"
          case "$permission" in
            admin|maintain|write) ;;
            *)
              echo "::notice::Ignoring readiness decision from a non-maintainer."
              exit 0
              ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr.json
          current_head_sha="$(jq -r '.head.sha' pr.json)"
          if [[ "$current_head_sha" != "$expected_head_sha" ]]; then
            echo "::notice::Ignoring stale readiness decision for $expected_head_sha; current head is $current_head_sha."
            exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$current_head_sha" \
            -f state="$state" \
            -f context='PR Readiness / Terra verdict' \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$PR_NUMBER"