name: Secret Scanning Status Check

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  security-events: read

jobs:
  Secret-Scanning-Check:
    runs-on: ubuntu-latest
    steps:
      - name: Run Secret Scanning Alert Check
        id: secrets_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/secret-scanning/alerts")"
          jq -e 'type == "array"' <<<"$response" > state.json
          jq -r '.[] | select(.state != "resolved")' state.json > unresolved.json
          if [ -s unresolved.json ]; then
            echo "::error file=unresolved.json,line=1,col=1::Unresolved secret scanning alerts detected"
            exit 1
          fi
        shell: bash
