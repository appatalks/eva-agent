name: Secret Scanning Status Check

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  Secret-Scanning-Check:
    runs-on: ubuntu-latest
    steps:
      - name: Run Secret Scanning Alert Check
        id: secrets_check
        env:
          SECRET_SCAN_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$SECRET_SCAN_TOKEN" ]]; then
            echo "::notice::Secret scanning is unavailable for this untrusted fork PR."
            exit 0
          fi
          response="$(curl --fail --location --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $SECRET_SCAN_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/secret-scanning/alerts")"
          jq -e 'if type == "array" then . else error("expected a secret-scanning alert array") end' <<<"$response" > state.json
          jq -r '.[] | select(.state != "resolved")' state.json > unresolved.json
          if [ -s unresolved.json ]; then
            echo "::error file=unresolved.json,line=1,col=1::Unresolved secret scanning alerts detected"
            exit 1
          fi
        shell: bash
